services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: poly_arbitrage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poly_arbitrage"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ./artifacts/postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./artifacts/rabbitmq:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./artifacts/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minio minio123 &&
        mc mb --ignore-existing local/raw-ingestion
    restart: "no"

  db-migrate:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      QUEUE_NAME: ${QUEUE_NAME:-ingestion-runs}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      FILESYSTEM_STORAGE_ROOT: ${FILESYSTEM_STORAGE_ROOT:-artifacts/datasets/raw}
      POLYMARKET_BASE_URL: ${POLYMARKET_BASE_URL:-https://gamma-api.polymarket.com}
      WORKER_MAX_ATTEMPTS_DEFAULT: ${WORKER_MAX_ATTEMPTS_DEFAULT:-5}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-30}
      RETRY_MAX_BACKOFF_SECONDS: ${RETRY_MAX_BACKOFF_SECONDS:-900}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-15}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      BROKER_RETRY_SECONDS: ${BROKER_RETRY_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["poly-init-db"]
    restart: "no"

  api:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      QUEUE_NAME: ${QUEUE_NAME:-ingestion-runs}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      FILESYSTEM_STORAGE_ROOT: ${FILESYSTEM_STORAGE_ROOT:-artifacts/datasets/raw}
      POLYMARKET_BASE_URL: ${POLYMARKET_BASE_URL:-https://gamma-api.polymarket.com}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      WORKER_MAX_ATTEMPTS_DEFAULT: ${WORKER_MAX_ATTEMPTS_DEFAULT:-5}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-30}
      RETRY_MAX_BACKOFF_SECONDS: ${RETRY_MAX_BACKOFF_SECONDS:-900}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-15}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      BROKER_RETRY_SECONDS: ${BROKER_RETRY_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    command: ["poly-api"]
    ports:
      - "8000:8000"

  scheduler:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      QUEUE_NAME: ${QUEUE_NAME:-ingestion-runs}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      FILESYSTEM_STORAGE_ROOT: ${FILESYSTEM_STORAGE_ROOT:-artifacts/datasets/raw}
      POLYMARKET_BASE_URL: ${POLYMARKET_BASE_URL:-https://gamma-api.polymarket.com}
      WORKER_MAX_ATTEMPTS_DEFAULT: ${WORKER_MAX_ATTEMPTS_DEFAULT:-5}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-30}
      RETRY_MAX_BACKOFF_SECONDS: ${RETRY_MAX_BACKOFF_SECONDS:-900}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-15}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      BROKER_RETRY_SECONDS: ${BROKER_RETRY_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    command: ["poly-scheduler"]
    restart: unless-stopped

  worker:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      QUEUE_NAME: ${QUEUE_NAME:-ingestion-runs}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      FILESYSTEM_STORAGE_ROOT: ${FILESYSTEM_STORAGE_ROOT:-artifacts/datasets/raw}
      POLYMARKET_BASE_URL: ${POLYMARKET_BASE_URL:-https://gamma-api.polymarket.com}
      WORKER_MAX_ATTEMPTS_DEFAULT: ${WORKER_MAX_ATTEMPTS_DEFAULT:-5}
      RETRY_BACKOFF_SECONDS: ${RETRY_BACKOFF_SECONDS:-30}
      RETRY_MAX_BACKOFF_SECONDS: ${RETRY_MAX_BACKOFF_SECONDS:-900}
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-15}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-5}
      BROKER_RETRY_SECONDS: ${BROKER_RETRY_SECONDS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    command: ["poly-worker"]
    restart: unless-stopped
