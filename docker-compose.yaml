services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: poly_arbitrage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poly_arbitrage"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ./artifacts/postgres:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --check=false
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "19092:19092"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./artifacts/minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minio minio123 &&
        mc mb --ignore-existing local/raw-ingestion
    restart: "no"

  db-migrate:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw-records}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      POLYMARKET_GAMMA_BASE_URL: ${POLYMARKET_GAMMA_BASE_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_CLOB_BASE_URL: ${POLYMARKET_CLOB_BASE_URL:-https://clob.polymarket.com}
      DAGSTER_HOME: /app/.dagster
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    command: ["poly-init-db"]
    restart: "no"

  api:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw-records}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      POLYMARKET_GAMMA_BASE_URL: ${POLYMARKET_GAMMA_BASE_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_CLOB_BASE_URL: ${POLYMARKET_CLOB_BASE_URL:-https://clob.polymarket.com}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      DAGSTER_HOME: /app/.dagster
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    command: ["poly-api"]
    ports:
      - "8000:8000"

  writer:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw-records}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      POLYMARKET_GAMMA_BASE_URL: ${POLYMARKET_GAMMA_BASE_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_CLOB_BASE_URL: ${POLYMARKET_CLOB_BASE_URL:-https://clob.polymarket.com}
      DAGSTER_HOME: /app/.dagster
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    command: ["poly-writer"]
    restart: unless-stopped

  dagster-webserver:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw-records}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      POLYMARKET_GAMMA_BASE_URL: ${POLYMARKET_GAMMA_BASE_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_CLOB_BASE_URL: ${POLYMARKET_CLOB_BASE_URL:-https://clob.polymarket.com}
      DAGSTER_HOME: /app/.dagster
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "workspace.yaml"]
    ports:
      - "3000:3000"
    restart: unless-stopped

  dagster-daemon:
    image: poly-arbitrage:local
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/poly_arbitrage
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-raw-records}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-raw-ingestion}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-raw}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minio}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minio123}
      POLYMARKET_GAMMA_BASE_URL: ${POLYMARKET_GAMMA_BASE_URL:-https://gamma-api.polymarket.com}
      POLYMARKET_CLOB_BASE_URL: ${POLYMARKET_CLOB_BASE_URL:-https://clob.polymarket.com}
      DAGSTER_HOME: /app/.dagster
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    command: ["dagster-daemon", "run", "-w", "workspace.yaml"]
    restart: unless-stopped
