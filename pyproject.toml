[tool.poetry]
name = "poly-arbitrage"
version = "0.1.0"
description = "Production-ready ingestion platform with Polymarket as the first source."
authors = ["emdim"]
readme = "README.md"
packages = [{ include = "poly_arbitrage", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.38.0"
alembic = "^1.16.4"
croniter = "^6.0.0"
dagster = "^1.11.10"
dagster-webserver = "^1.11.10"
fastapi = "^0.116.0"
httpx = "^0.28.1"
kafka-python-ng = "^2.2.3"
psycopg = {version = "^3.2.9", extras = ["binary"]}
sqlalchemy = "^2.0.41"
uvicorn = "^0.35.0"
websockets = "^15.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.0"
pytest-asyncio = "^0.26.0"
ruff = "^0.11.2"

[tool.poetry.scripts]
poly-api = "poly_arbitrage.api.app:run"
poly-init-db = "poly_arbitrage.runtime.init_db:main"
poly-quote-stream = "poly_arbitrage.runtime.stream_worker:main"
poly-writer = "poly_arbitrage.runtime.writer_service:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
